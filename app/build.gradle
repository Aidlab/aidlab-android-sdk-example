apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jlleitschuh.gradle.ktlint'
apply plugin: 'dev.detekt'

android {

    buildFeatures {
        compose = true
    }

    compileSdk = rootProject.ext.compileSdkVersion
    namespace = 'com.aidlab.example'

    compileOptions {
        sourceCompatibility = rootProject.ext.javaVersion
        targetCompatibility = rootProject.ext.javaVersion
    }
    defaultConfig {
        applicationId = "com.aidlab.example"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
            jniDebuggable = true
        }
    }
    lint {
        abortOnError = true
        warningsAsErrors = true
        disable 'AndroidGradlePluginVersion', 'GradleDependency'
    }
}

detekt {
    toolVersion = "2.0.0-alpha.3"
    config = files("../detekt.yml")
    buildUponDefaultConfig = false
    allRules = false
    autoCorrect = false
    ignoreFailures = false
    failOnSeverity = dev.detekt.gradle.extensions.FailOnSeverity.Info
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.aidlab:sdk:2.4.0'

    testImplementation 'junit:junit:4.13.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    implementation 'androidx.compose.ui:ui:1.11.2'
    implementation 'androidx.compose.material:material:1.11.2'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.2'
    implementation "androidx.activity:activity-compose:1.13.0"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.11.2'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.2'
}
