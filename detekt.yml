processors:
  active: true

config:
  validation: true

build:
  maxIssues: 0
  excludeCorrectable: false

# Keep full Detekt coverage with maxIssues=0 gate.
style:
  active: true
complexity:
  active: true
performance:
  active: true
exceptions:
  active: true
naming:
  active: true
comments:
  active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  NullableToStringCall:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
