processors:
  active: true

config:
  validation: true

# Keep full Detekt coverage; the Gradle task fails on reported findings.
style:
  active: true
complexity:
  active: true
performance:
  active: true
exceptions:
  active: true
naming:
  active: true
comments:
  active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  NullableToStringCall:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
